    <!-- นำเข้าฟอนต์ภาษาไทย -->

                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'float-slow': 'float 8s ease-in-out infinite',
                        'float-fast': 'float 4s ease-in-out infinite',
                        'wave': 'wave 15s linear infinite',
                        'wave-slow': 'wave 20s linear infinite',
                        'blob': 'blob 7s infinite',
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards'
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        wave: {
                            '0%': { backgroundPositionX: '0px' },
                            '100%': { backgroundPositionX: '1000px' },
                        },
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(40px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #fbcfe8 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.8);
        }

        .progress-ring__circle {
            transition: stroke-dashoffset 1s ease-in-out;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.5);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(56, 189, 248, 0.8);
        }

        .wave-bg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100" preserveAspectRatio="none"><path d="M0,50 Q250,100 500,50 T1000,50 L1000,100 L0,100 Z" fill="rgba(255,255,255,0.4)"/></svg>');
            background-size: 1000px 100px;
            z-index: 0;
        }

        .wave-bg-2 {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100" preserveAspectRatio="none"><path d="M0,50 Q250,0 500,50 T1000,50 L1000,100 L0,100 Z" fill="rgba(255,255,255,0.6)"/></svg>');
            background-size: 1000px 100px;
            z-index: 0;
            animation-direction: reverse;
        }

        .details-container {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.5s ease-out;
        }

        .details-container.open {
            grid-template-rows: 1fr;
        }

        .details-inner {
            overflow: hidden;
        }
    </style>
</head>

        function processData() {
            const students = {};
            const hwLines = rawHWData.trim().split('\n');
            for (let i = 1; i < hwLines.length; i++) {
                const line = hwLines[i].trim();
                if (!line) continue;
                const delimiter = line.includes('\t') ? '\t' : ',';
                const cols = line.split(delimiter).map(c => c.trim());
                if (cols.length >= 17 && cols[1]) {
                    const id = cols[1];
                    students[id] = {
                        id: id,
                        name: cols[2],
                        details: {
                            hw1: cols[3], hw2: cols[4], q1: cols[5],
                            cw1: cols[6], cw2: cols[7], cw3: cols[8],
                            hw3: cols[9], bn1: cols[10], cw4: cols[11],
                            cw5: cols[12], hw4: cols[13], cw6: cols[14],
                            cw7: cols[15], hw_raw_total: cols[16],
                            proj_raw: '', proj_penalty: ''
                        },
                        hw_scaled: parseFloat(cols[17]) || 0,
                        proj_scaled: 0
                    };
                }
            }

            const projLines = rawProjectData.trim().split('\n');
            for (let i = 1; i < projLines.length; i++) {
                const line = projLines[i].trim();
                if (!line) continue;
                const delimiter = line.includes('\t') ? '\t' : ',';
                const cols = line.split(delimiter).map(c => c.trim());
                if (cols.length >= 6 && cols[1]) {
                    const id = cols[1];
                    if (!students[id]) {
                        students[id] = {
                            id: id, name: cols[2], hw_scaled: 0, proj_scaled: 0,
                            details: { hw1: '', hw2: '', q1: '', cw1: '', cw2: '', cw3: '', hw3: '', bn1: '', cw4: '', cw5: '', hw4: '', cw6: '', cw7: '', hw_raw_total: '', proj_raw: '', proj_penalty: '' }
                        };
                    }
                    students[id].details.proj_raw = cols[3];
                    students[id].details.proj_penalty = cols[4];
                    students[id].proj_scaled = parseFloat(cols[5]) || 0;
                }
            }

            return Object.values(students).map(student => ({
                ...student,
                total: student.hw_scaled + student.proj_scaled
            }));
        }

        const processedData = processData();

        function initStats() {
            if (processedData.length === 0) return;
            const totals = processedData.map(s => s.total);
            document.getElementById('statMax').textContent = Math.max(...totals).toFixed(2);
            document.getElementById('statMin').textContent = Math.min(...totals).toFixed(2);
            document.getElementById('statAvg').textContent = (totals.reduce((sum, val) => sum + val, 0) / totals.length).toFixed(2);
        }

        function toggleDetails() {
            const container = document.getElementById('detailsContainer');
            const icon = document.getElementById('toggleIcon');
            const text = document.getElementById('toggleText');

            if (container.classList.contains('open')) {
                container.classList.remove('open');
                icon.style.transform = 'rotate(0deg)';
                text.textContent = 'แสดงรายละเอียดคะแนน 🔍';
            } else {
                container.classList.add('open');
                icon.style.transform = 'rotate(180deg)';
                text.textContent = 'ซ่อนรายละเอียด';
            }
        }

            const val = (score !== null && score !== undefined && score !== '') ? score : '-';
            const maxStr = max ? `<span class="text-xs text-slate-500 font-medium ml-1">(เต็ม ${max})</span>` : '';
            return `

                    </span>

                </div>
            `;
        }

        function getProgressCircle(value, max, colorClass, size = 120) {
            const radius = 45;
            const circumference = 2 * Math.PI * radius;
            const offset = circumference - ((value / max) * circumference);
            return `
                <div class="relative inline-flex items-center justify-center">
                    <svg class="transform -rotate-90 w-32 h-32">
                        <circle cx="64" cy="64" r="45" stroke="currentColor" stroke-width="8" fill="transparent" class="text-white/50" />
                        <circle cx="64" cy="64" r="45" stroke="currentColor" stroke-width="8" fill="transparent" 
                            class="${colorClass} progress-ring__circle drop-shadow-md" 
                            stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" stroke-linecap="round" />
                    </svg>
                    <div class="absolute flex flex-col items-center justify-center">
                        <span class="text-3xl font-black text-slate-700">${value.toFixed(1)}</span>
                        <span class="text-xs font-bold text-slate-500 mt-1">เต็ม ${max}</span>
                    </div>
                </div>
            `;
        }

                                                </div>
                                            </div>
                                            <div class="mt-4 pt-4 border-t-2 border-purple-200 flex justify-between items-center px-2">
                                                <span class="font-cute font-bold text-purple-800 text-lg">คะแนนสุทธิโครงงาน</span>
                                                <span class="font-black text-2xl text-purple-600">${student.proj_scaled.toFixed(2)}</span>
                                            </div>
                                        </div>
                                        
                                        <!-- Info Note -->
                                        <div class="bg-blue-50/80 rounded-[2rem] p-6 border border-blue-100 flex gap-4 mt-auto">
                                            <i data-lucide="info" class="w-6 h-6 text-blue-400 flex-shrink-0 mt-1"></i>
                                            <p class="text-sm text-slate-600 leading-relaxed">
                                                <strong class="font-cute text-slate-700">เกณฑ์การคำนวณ:</strong><br>
                                                หมวดการบ้านและงานในชั้นเรียน จะถูกปรับสัดส่วนเป็น 20 คะแนน และโครงงาน 10 คะแนน 
                                                รวมเป็นคะแนนเก็บ 30 คะแนน
                                            </p>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            `;

            resultArea.classList.remove('hidden');
            lucide.createIcons();

            setTimeout(() => {
                resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }

        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const errorMsg = document.getElementById('errorMsg');
        const resultArea = document.getElementById('resultArea');
        const searchContainer = document.getElementById('searchContainer');
        const statsRow = document.getElementById('statsRow');

        function handleSearch() {
            const query = searchInput.value.trim().toUpperCase();

            errorMsg.classList.add('hidden');
            resultArea.classList.add('hidden');

            if (!query) {
                document.getElementById('errorText').textContent = 'กรุณาระบุรหัสนักศึกษา';
                errorMsg.classList.remove('hidden');
                return;
            }

            const foundStudent = processedData.find(s => s.id.toUpperCase() === query);

            if (foundStudent) {
                // Move search bar up
                searchContainer.classList.add('-translate-y-4');
                // Hide global stats to focus on result
                statsRow.style.display = 'none';

                showStudentResult(foundStudent);
            } else {
                document.getElementById('errorText').textContent = 'ไม่พบข้อมูลรหัสนักศึกษาในระบบ กรุณาตรวจสอบอีกครั้ง';
                errorMsg.classList.remove('hidden');
            }
        }

        searchBtn.addEventListener('click', handleSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });
        searchInput.addEventListener('input', (e) => {
            if (e.target.value === '') {
                errorMsg.classList.add('hidden');
                resultArea.classList.add('hidden');
                searchContainer.classList.remove('-translate-y-4');
                statsRow.style.display = 'grid';
            }
        });

        initStats();
    </script>
</body>

</html>
