<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENG30 2033 Hydrology · คะแนนเก็บ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --sky: #E3F4FF;
  --mint: #DEF7EE;
  --droplet: #4FC3F7;
  --droplet-deep: #0288D1;
  --ink: #1B3550;
  --ink-soft: #5B7894;
  --sunshine: #FFD54F;
  --blush: #FFADC7;
  --card: rgba(255, 255, 255, 0.72);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Mitr', 'Fredoka', system-ui, -apple-system, 'Segoe UI', sans-serif;
  background: linear-gradient(160deg, var(--sky) 0%, var(--mint) 100%);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* Floating bubbles */
.bubble {
  position: fixed;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(79,195,247,0.25) 60%, rgba(79,195,247,0.05));
  pointer-events: none;
  z-index: 0;
  animation: floatUp linear infinite;
}

@keyframes floatUp {
  0%   { transform: translateY(110vh) scale(0.6); opacity: 0; }
  10%  { opacity: 0.7; }
  90%  { opacity: 0.7; }
  100% { transform: translateY(-15vh) scale(1.1); opacity: 0; }
}

.container {
  max-width: 560px;
  margin: 0 auto;
  padding: 40px 20px 80px;
  position: relative;
  z-index: 1;
}

header {
  text-align: center;
  margin-bottom: 28px;
}

.mascot {
  width: 110px;
  height: 130px;
  margin: 0 auto 12px;
  filter: drop-shadow(0 8px 16px rgba(2,136,209,0.25));
  animation: bob 3s ease-in-out infinite;
}

@keyframes bob {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50%      { transform: translateY(-8px) rotate(2deg); }
}

h1 {
  font-family: 'Fredoka', sans-serif;
  font-size: 34px;
  font-weight: 700;
  color: var(--droplet-deep);
  letter-spacing: -0.5px;
  line-height: 1.1;
}

h1 .splash {
  display: inline-block;
  background: linear-gradient(120deg, var(--droplet), var(--droplet-deep));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.thai-title {
  margin-top: 6px;
  font-size: 17px;
  font-weight: 500;
  color: var(--ink);
}

.subtitle {
  margin-top: 4px;
  font-size: 14px;
  font-weight: 400;
  color: var(--ink-soft);
}

.lookup-card {
  background: var(--card);
  backdrop-filter: blur(10px);
  border-radius: 24px;
  padding: 26px;
  box-shadow: 0 8px 32px rgba(2,136,209,0.1);
  border: 1px solid rgba(255,255,255,0.5);
}

.lookup-card label {
  display: block;
  font-size: 14px;
  color: var(--ink-soft);
  margin-bottom: 10px;
  font-weight: 500;
  text-align: center;
}

.lookup-row {
  display: flex;
  gap: 8px;
}

.lookup-card input {
  flex: 1;
  min-width: 0;
  font-family: 'Fredoka', monospace;
  font-size: 20px;
  font-weight: 500;
  padding: 14px 18px;
  border: 2px solid rgba(79,195,247,0.3);
  border-radius: 16px;
  background: white;
  color: var(--ink);
  transition: border-color 0.2s, box-shadow 0.2s;
  letter-spacing: 2px;
  text-align: center;
}

.lookup-card input:focus {
  outline: none;
  border-color: var(--droplet);
  box-shadow: 0 0 0 4px rgba(79,195,247,0.15);
}

.go-btn {
  border: none;
  border-radius: 16px;
  padding: 0 22px;
  font-family: 'Mitr', sans-serif;
  font-size: 16px;
  font-weight: 500;
  color: white;
  background: linear-gradient(135deg, var(--droplet), var(--droplet-deep));
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
  box-shadow: 0 4px 12px rgba(2,136,209,0.3);
  white-space: nowrap;
}

.go-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(2,136,209,0.35); }
.go-btn:active { transform: translateY(1px); }
.go-btn:disabled { opacity: 0.6; cursor: progress; transform: none; }

.spinner {
  display: inline-block;
  width: 15px;
  height: 15px;
  border: 2.5px solid rgba(255,255,255,0.4);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  vertical-align: -2px;
}

@keyframes spin { to { transform: rotate(360deg); } }

.hint {
  font-family: 'Mitr', sans-serif;
  font-size: 13px;
  color: var(--ink-soft);
  margin-top: 10px;
  text-align: center;
  line-height: 1.6;
}

.hint code {
  background: rgba(79,195,247,0.15);
  padding: 1px 6px;
  border-radius: 6px;
  font-family: 'Fredoka', monospace;
}

.result {
  margin-top: 20px;
  padding: 24px;
  border-radius: 20px;
  background: linear-gradient(135deg, #fff, #F3FBFF);
  box-shadow: 0 4px 20px rgba(2,136,209,0.08);
  border: 1px solid rgba(79,195,247,0.2);
  display: none;
}

.result.show { display: block; animation: pop 0.4s cubic-bezier(.18,.89,.32,1.28); }

@keyframes pop {
  from { opacity: 0; transform: scale(0.94); }
  to   { opacity: 1; transform: scale(1); }
}

.result.soft {
  background: linear-gradient(135deg, #FFF8F0, #FFE9DD);
  border-color: rgba(255,173,199,0.4);
}

.result-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 18px;
}

.avatar {
  width: 56px;
  height: 56px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--droplet), var(--droplet-deep));
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 26px;
  font-weight: 600;
  font-family: 'Mitr', sans-serif;
  flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(2,136,209,0.25);
}

.result-info .name {
  font-size: 18px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.2;
}

.result-info .sid {
  font-family: 'Fredoka', monospace;
  font-size: 13px;
  color: var(--ink-soft);
  margin-top: 4px;
  letter-spacing: 1px;
}

.score-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 18px;
}

.score-cell {
  background: white;
  border-radius: 16px;
  padding: 14px 10px;
  text-align: center;
  border: 1px solid rgba(79,195,247,0.15);
}

.score-cell .label {
  font-size: 12px;
  color: var(--ink-soft);
  margin-bottom: 6px;
  font-weight: 400;
}

.score-cell .value {
  font-family: 'Fredoka', sans-serif;
  font-size: 26px;
  font-weight: 600;
  color: var(--droplet-deep);
  line-height: 1;
}

.score-cell .max {
  font-size: 13px;
  color: var(--ink-soft);
  font-weight: 400;
  margin-left: 1px;
}

.score-cell.total {
  background: linear-gradient(135deg, var(--droplet), var(--droplet-deep));
  border: none;
  box-shadow: 0 4px 14px rgba(2,136,209,0.25);
}

.score-cell.total .label,
.score-cell.total .value { color: white; }
.score-cell.total .max   { color: rgba(255,255,255,0.85); }

.bar-wrap {
  background: rgba(79,195,247,0.15);
  border-radius: 100px;
  height: 12px;
  overflow: hidden;
  margin: 8px 0 6px;
}

.bar {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--droplet), var(--droplet-deep));
  border-radius: 100px;
  transition: width 1s cubic-bezier(.18,.89,.32,1.28);
  box-shadow: 0 0 12px rgba(79,195,247,0.5);
}

.bar-text {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--ink-soft);
  font-family: 'Fredoka', sans-serif;
}

.message {
  margin-top: 14px;
  font-size: 14px;
  text-align: center;
  color: var(--ink);
  padding: 12px;
  background: rgba(255,213,79,0.18);
  border-radius: 12px;
  font-weight: 400;
}

.center-msg { text-align: center; }
.center-msg .emoji { font-size: 38px; }
.center-msg .big { margin-top: 8px; font-size: 15px; color: var(--ink); }
.center-msg .small { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }

footer {
  text-align: center;
  margin-top: 26px;
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.7;
}

footer .heart { color: var(--blush); font-size: 14px; }

.more-btn {
  display: block;
  margin: 14px auto 0;
  border: none;
  background: none;
  font-family: 'Mitr', sans-serif;
  font-size: 13px;
  font-weight: 500;
  color: var(--droplet-deep);
  cursor: pointer;
  padding: 7px 16px;
  border-radius: 100px;
  transition: background 0.2s;
}

.more-btn:hover { background: rgba(79,195,247,0.12); }

.detail {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.45s ease;
}

.detail.open { max-height: 2200px; }

.dt-sec { margin-top: 16px; }

.dt-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  padding: 0 4px 8px;
  border-bottom: 1px solid rgba(79,195,247,0.2);
}

.dt-sum {
  font-family: 'Fredoka', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--droplet-deep);
}

.dt-list { list-style: none; margin: 6px 0 0; padding: 0; }

.dt-list li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  color: var(--ink);
  padding: 7px 8px;
  border-radius: 8px;
}

.dt-list li:nth-child(odd) { background: rgba(79,195,247,0.06); }
.dt-list li span { color: var(--ink-soft); }

.dt-list li b {
  font-family: 'Fredoka', sans-serif;
  font-weight: 600;
  color: var(--droplet-deep);
  white-space: nowrap;
}

.dt-list li b i {
  font-style: normal;
  font-weight: 400;
  color: var(--ink-soft);
  font-size: 12px;
}

.dt-list li b.miss { color: var(--blush); }

@media (max-width: 480px) {
  h1 { font-size: 27px; }
  .score-grid { grid-template-columns: 1fr; }
  .lookup-row { flex-direction: column; }
  .go-btn { padding: 13px; }
}
</style>
</head>

// ----- floating bubbles -----
(function makeBubbles() {
  const N = 14;
  for (let i = 0; i < N; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = 14 + Math.random() * 40;
    b.style.width  = size + 'px';
    b.style.height = size + 'px';
    b.style.left   = (Math.random() * 100) + 'vw';
    b.style.animationDuration = (12 + Math.random() * 18) + 's';
    b.style.animationDelay    = (-Math.random() * 20) + 's';
    document.body.appendChild(b);
  }
})();

// ----- crypto helpers -----
const subtle = (window.crypto && window.crypto.subtle) ? window.crypto.subtle : null;
const b64ToBytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const SALT = b64ToBytes(ENC.salt);

async function deriveKey(id) {
  const base = await subtle.importKey(
    'raw', new TextEncoder().encode(id), 'PBKDF2', false, ['deriveKey']);
  return subtle.deriveKey(
    { name: 'PBKDF2', salt: SALT, iterations: ENC.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}

async function lookup(id) {
  const key = await deriveKey(id);
  for (const r of ENC.recs) {
    try {
      const pt = await subtle.decrypt(
        { name: 'AES-GCM', iv: b64ToBytes(r.iv) }, key, b64ToBytes(r.ct));
      const rec = JSON.parse(new TextDecoder().decode(pt));
      rec.id = id;
      return rec;
    } catch (e) { /* wrong key for this record — keep trying */ }
  }
  return null;
}

// ----- UI -----
const sidInput = document.getElementById('sid');
const goBtn    = document.getElementById('go');
const result   = document.getElementById('result');

function messageFor(total) {
  if (total >= 28) return 'ยอดเยี่ยมที่สุด! 🌟 คะแนนออกมาดีมาก';
  if (total >= 25) return 'เก่งมาก! เยี่ยมสุดๆ! 💧 ทำได้ดีมาก!';
  if (total >= 22) return 'ทำได้ดีมาก ลุยต่อไปนะ! 🌊 พี่แคนเอาใจช่วย';
  if (total >= 18) return 'พยายามเข้าไว้นะ สู้ๆ! 🌱';
  return 'พัฒนาได้อีกเยอะเลย — อย่าเพิ่งท้อ! 🌧️';
}

function stripPrefix(name) {
  return (name || '').replace(/^(นางสาว|นาย|นาง)\s*/, '');
}

function softMsg(emoji, big, small) {
  result.className = 'result show soft';
  result.innerHTML =
    '<div class="center-msg"><div class="emoji">' + emoji + '</div>' +
    '<p class="big">' + big + '</p>' +
    (small ? '<p class="small">' + small + '</p>' : '') + '</div>';
}

function buildDetail(s) {
  const d = s.detail || {};
  const items = d.items || [];
  const dv = v => (v == null ? '–' : v);
  const rows = items.map(it =>
    `<li><span>${it.l}</span><b class="${it.s == null ? 'miss' : ''}">` +
    `${it.s == null ? 'ขาดส่ง' : it.s}<i> / ${dv(it.m)}</i></b></li>`).join('');
  const late = (d.pjLate != null && d.pjLate !== 0)
    ? `<li><span>หักส่งช้า (late)</span><b class="miss">${d.pjLate}</b></li>` : '';
  return `
    <div class="dt-sec">
      <div class="dt-head"><span>📘 HW / CW</span>
        <span class="dt-sum">${dv(d.hwRaw)} / ${dv(d.hwMax)} → ${dv(s.hw)} / 20</span></div>
      <ul class="dt-list">${rows}</ul>
    </div>
    <div class="dt-sec">
      <div class="dt-head"><span>📗 Project</span>
        <span class="dt-sum">${dv(d.pjFinal)} / 10</span></div>
      <ul class="dt-list">
        <li><span>คะแนนดิบ (raw)</span><b>${dv(d.pjRaw)}<i> / 10</i></b></li>
        ${late}
        <li><span>คะแนนสุดท้าย (final)</span><b>${dv(d.pjFinal)}<i> / 10</i></b></li>
      </ul>
    </div>`;
}

function renderResult(student) {
  const trimmed = stripPrefix(student.name);
  const initial = trimmed.charAt(0) || '?';
  const pct = (student.total / 30 * 100).toFixed(1);
  const fmt = (v, d) => (v == null ? '–' : v.toFixed(d));
  result.className = 'result show';
  result.innerHTML = `
    <div class="result-header">
      <div class="avatar">${initial}</div>
      <div class="result-info">
        <div class="name">${student.name}</div>
        <div class="sid">${student.id} · ลำดับที่ ${student.no}</div>
      </div>
    </div>
    <div class="score-grid">
      <div class="score-cell">
        <div class="label">HW / CW</div>
        <div class="value">${fmt(student.hw, 2)}<span class="max">/20</span></div>
      </div>
      <div class="score-cell">
        <div class="label">Project</div>
        <div class="value">${fmt(student.project, 1)}<span class="max">/10</span></div>
      </div>
      <div class="score-cell total">
        <div class="label">รวมทั้งหมด</div>
        <div class="value">${fmt(student.total, 2)}<span class="max">/30</span></div>
      </div>
    </div>
    <div class="bar-wrap"><div class="bar"></div></div>
    <div class="bar-text"><span>0</span><span>${pct}% ของ 30 คะแนน</span><span>30</span></div>
    <p class="message">${messageFor(student.total)}</p>
    <button class="more-btn" id="moreBtn" type="button" aria-expanded="false">ดูรายละเอียดคะแนน ▾</button>
    <div class="detail" id="detailBox">${buildDetail(student)}</div>`;
  requestAnimationFrame(() => {
    result.querySelector('.bar').style.width = pct + '%';
  });
  const moreBtn = document.getElementById('moreBtn');
  const detailBox = document.getElementById('detailBox');
  moreBtn.addEventListener('click', () => {
    const open = detailBox.classList.toggle('open');
    moreBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    moreBtn.textContent = open ? 'ซ่อนรายละเอียด ▴' : 'ดูรายละเอียดคะแนน ▾';
  });
}

let busy = false;
async function doLookup() {
  if (busy) return;
  const id = sidInput.value.trim().toUpperCase();
  sidInput.value = id;

  if (!subtle) {
    softMsg('🔒', 'เบราว์เซอร์นี้ไม่รองรับการถอดรหัส',
      'กรุณาเปิดด้วย Chrome, Edge, Firefox หรือ Safari รุ่นใหม่');
    return;
  }
  if (!/^B\d{7}$/.test(id)) {
    softMsg('✏️', 'รูปแบบรหัสไม่ถูกต้อง', 'ตัวอย่างที่ถูกต้อง เช่น B6705770');
    return;
  }

  busy = true;
  goBtn.disabled = true;
  goBtn.innerHTML = '<span class="spinner"></span>';
  result.className = 'result show';
  result.innerHTML =
    '<div class="center-msg"><div class="emoji">💧</div>' +
    '<p class="big">กำลังตรวจสอบ…</p></div>';

  try {
    const student = await lookup(id);
    if (student) renderResult(student);
    else softMsg('🔍', 'ไม่พบรหัสนี้ในรายชื่อ', 'ลองตรวจสอบรหัสนักศึกษาอีกครั้งนะ');
  } catch (e) {
    softMsg('😵', 'เกิดข้อผิดพลาด', 'ลองใหม่อีกครั้ง');
  } finally {
    busy = false;
    goBtn.disabled = false;
    goBtn.textContent = 'ดูคะแนน';
  }
}

goBtn.addEventListener('click', doLookup);
sidInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLookup(); });
